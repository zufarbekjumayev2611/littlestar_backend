# /etc/nginx/sites-available/littlestar-api   (keyin: sudo certbot --nginx -d api.littlestar.uz)
server {
    listen 80;
    server_name api.littlestar.uz;

    # O‘qituvchi video yuklashi uchun katta hajm; fayl to‘g‘ridan-to‘g‘ri Node’ga oqim bilan uzatiladi
    client_max_body_size 2g;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
